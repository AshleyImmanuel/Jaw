<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jaw Demo App</title>
  <link rel="icon" href="data:,">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    #jaw-root { 
      width: 100vw; 
      height: 100vh;
      display: block; /* The Jaw layout engine relies ond absolute positioning inside this relative container */
      position: relative;
    }
  </style>
</head>
<body>
  <div id="jaw-root"></div>
  <!-- Note: The jaw dev server dynamically maps this to the bundled output -->
  <script type="module" src="./dist/app.js"></script>
</body>
</html>
